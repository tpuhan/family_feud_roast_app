<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feud Controller</title>
  <link rel="stylesheet" href="/static/feud.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="controller-body">
  <div class="controller">
    <h1>Host Controller</h1>
    <div class="row">
      <button id="prev">⬅ Previous</button>
      <button id="next">Next ➡</button>
      <div class="select-row">
        <label>Jump to:</label>
        <input type="number" id="jumpIndex" min="1" value="1" style="width:70px;">
        <button id="jumpBtn">Go</button>
      </div>
    </div>

    <div class="panel">
      <div><strong id="qmeta">Question ? of ?</strong></div>
      <div class="question" id="question">Loading…</div>
    </div>

    <div class="panel" id="answersPanel">
      <h3>Answers</h3>
      <div id="answers"></div>
      <div class="row">
        <button id="revealAll">Reveal All</button>
        <button id="resetReveals">Hide All</button>
      </div>
    </div>

    <div class="panel">
      <h3>Strikes</h3>
      <div class="row">
        <button id="addStrike">+ Strike</button>
        <button id="removeStrike">- Strike</button>
      </div>
    </div>

    <div class="panel">
      <h3>Scores</h3>
      <div class="row">
        <div class="score-edit">
          <span>Team A:</span><input type="number" id="ptsA" value="0" style="width:80px;">
          <button id="addA">Add</button>
        </div>
        <div class="score-edit">
          <span>Team B:</span><input type="number" id="ptsB" value="0" style="width:80px;">
          <button id="addB">Add</button>
        </div>
      </div>
      <div id="currentScores" style="margin-top:10px; font-weight:bold;"></div>
      <div class="row small">
        <button id="resetScores">Reset Scores</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let cached = null;

    function render(payload){
      cached = payload;
      const {question_index, question_total, question, answers, revealed, strikes, scores} = payload;
      document.getElementById("qmeta").textContent = `Question ${question_index+1} of ${question_total}`;
      document.getElementById("question").textContent = question;
      document.getElementById("jumpIndex").value = question_index+1;

      const ansWrap = document.getElementById("answers");
      ansWrap.innerHTML = "";
      answers.forEach((a, i) => {
        const row = document.createElement("div");
        row.className = "ans-row";

        const btn = document.createElement("button");
        btn.textContent = (revealed[i] ? "Hide" : "Reveal") + ` #${i+1} (${a.points})`;
        btn.onclick = () => {
          socket.emit(revealed[i] ? "hide_answer" : "reveal_answer", {i});
        };

        const label = document.createElement("div");
        label.className = "ans-label " + (revealed[i] ? "is-revealed":"");
        label.textContent = `${i+1}. ${a.text} — ${a.points}`;

        row.appendChild(btn);
        row.appendChild(label);
        ansWrap.appendChild(row);
      });

      // Update current scores display
      const scoreDiv = document.getElementById("currentScores");
      scoreDiv.textContent = `Current Scores - Team A: ${scores.A} | Team B: ${scores.B}`;
    }

    // Controls
    document.getElementById("next").onclick = () => socket.emit("next_question");
    document.getElementById("prev").onclick = () => socket.emit("prev_question");
    document.getElementById("jumpBtn").onclick = () => {
      const idx = parseInt(document.getElementById("jumpIndex").value || "1", 10) - 1;
      socket.emit("set_question", {index: idx});
    };
    document.getElementById("revealAll").onclick = () => socket.emit("reveal_all");
    document.getElementById("resetReveals").onclick = () => socket.emit("reset_reveals");
    document.getElementById("addStrike").onclick = () => socket.emit("add_strike");
    document.getElementById("removeStrike").onclick = () => socket.emit("remove_strike");

    document.getElementById("addA").onclick = () => {
      const pts = parseInt(document.getElementById("ptsA").value || "0", 10);
      socket.emit("award_points", {team: "Team A", points: pts});
    };
    document.getElementById("addB").onclick = () => {
      const pts = parseInt(document.getElementById("ptsB").value || "0", 10);
      socket.emit("award_points", {team: "Team B", points: pts});
    };
    document.getElementById("resetScores").onclick = () => {
      socket.emit("set_scores", {A: 0, B: 0});
    };

    socket.on("connect", ()=> socket.emit("request_state"));
    socket.on("update_state", render);
  </script>
</body>
</html>
